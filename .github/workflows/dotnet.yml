name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v1.0.0 (used for manual runs)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            asset: memogram-linux-x64.tar.gz
          - os: windows-latest
            rid: win-x64
            asset: memogram-win-x64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute release version
        shell: bash
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}"
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=${VERSION:-0.0.0}" >> "$GITHUB_ENV"

      - name: Publish single-file
        shell: bash
        run: dotnet publish Memogram/Memogram.csproj -c Release -r ${{ matrix.rid }} --self-contained false -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:Version=$RELEASE_VERSION -o publish

      - name: Package (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf ${{ matrix.asset }} -C publish .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ matrix.asset }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --generate-notes
